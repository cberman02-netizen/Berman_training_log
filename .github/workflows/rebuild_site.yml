name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - 'data/erg_captures.json'
      - 'data/title_overrides.json'
      - 'data/commute_overrides.json'
      - 'data/type_overrides.json'
      - 'data/week_config.json'
      - 'data/body_metrics.json'
      - 'data/intervals.json'
      - 'data/strava_activities_*.csv'
      - 'data/streams/**'
      - 'template.html'
  workflow_dispatch: {}

permissions:
  contents: write

# Flagging several commutes in a row makes one commit (and one run) per flag. Without this, each
# run builds, then loses the push race to the next flag's commit and fails. A newer run always
# builds from a commit that includes the older one's data, so cancelling the older run is safe.
concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index.html
        run: python build_site.py

      - name: Commit built site
        run: |
          git config user.name "training-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --quiet --staged || git commit -m "Rebuild site"
          if ! git push; then
            # Rejected because main moved while this ran (e.g. another commute flag landed). That
            # newer commit has its own run, built from data that includes this one's, so skipping
            # is safe. If main did NOT move, the push failed for some other reason: fail loudly.
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::notice::main moved on while this run was building; the newer run will rebuild."
              exit 0
            fi
            exit 1
          fi
