name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - 'data/erg_captures.json'
      - 'data/title_overrides.json'
      - 'data/commute_overrides.json'
      - 'data/strava_activities_*.csv'
      - 'data/streams/**'
      - 'template.html'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index.html
        run: python build_site.py

      - name: Commit built site
        run: |
          git config user.name "training-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --quiet --staged || git commit -m "Rebuild site"
          git push
