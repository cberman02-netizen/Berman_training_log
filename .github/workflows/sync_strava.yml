name: Sync Strava

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Pull new activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python sync_strava.py

      # sync_strava.py can pick up a rotated Strava refresh token, but it only
      # persists that to a local .env (gitignored) — it has no way to update the
      # STRAVA_REFRESH_TOKEN secret itself. If Strava ever rotates it, this step's
      # sync still succeeds, but future runs will start failing until the
      # STRAVA_REFRESH_TOKEN secret is updated by hand (Settings > Secrets > Actions).
      - name: Commit new activity data
        id: commit
        run: |
          git config user.name "training-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --quiet --staged; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync new Strava activities"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit pushed with the default GITHUB_TOKEN (as above) deliberately does
      # NOT trigger other workflows' `on: push` listeners — GitHub suppresses that
      # to prevent infinite workflow loops. So rebuild_site.yml's push trigger never
      # fires from this commit; it has to be kicked off explicitly instead.
      - name: Trigger site rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rebuild_site.yml --repo ${{ github.repository }}
