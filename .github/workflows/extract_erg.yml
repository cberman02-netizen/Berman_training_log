name: Extract erg screenshot

on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: Strava activity ID
        required: true
        type: string
      device:
        description: "Device hint: RowErg, BikeErg, or blank to auto-detect"
        required: false
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install pytesseract opencv-python-headless numpy pillow

      - name: Run OCR extraction
        run: python process_erg_upload.py --activity-id "${{ inputs.activity_id }}" --device "${{ inputs.device }}"

      - name: Commit extracted data
        run: |
          git config user.name "training-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pending/
          git diff --quiet --staged || git commit -m "Extract erg data for activity ${{ inputs.activity_id }}"
          git push
